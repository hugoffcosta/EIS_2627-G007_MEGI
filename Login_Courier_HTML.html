<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courier Login | CMS</title>
    <link rel="stylesheet" href="Registration_Courier_CSS.css">
    <link rel="stylesheet" href="Login_Courier_CSS.css">
    <script src="Login_Courier_JS.js" defer></script>
</head>
<body class="role-selection-page page-login">
<header class="main-header">
                    <nav class="navbar" aria-label="Main navigation">
                        <a href="menu_login.html" class="brand" aria-label="CMS home"><span class="brand-icon"><svg class="site-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5h12v12H2zM14 9h4l4 5v3h-8M17 9v5h5"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg></span><span><span class="brand-name">CMS</span><span class="brand-subtitle">Courier Management System</span></span></a>
                        <div class="nav-links"><a href="menu_login.html">Home</a><a href="#about">About</a></div>

                <div class="nav-actions"><a href="menu_login.html" class="login-link">Login</a><a href="menu_registration.html" class="register-nav-button">Register</a></div>
                    </nav>
                </header>
    <main class="courier-login-wrapper">
        <a class="login-back-link" href="menu_login.html"><span aria-hidden="true">&larr;</span> Account types</a>
        <section class="courier-login-card" aria-labelledby="courier-login-title">
            <h1 id="courier-login-title">Courier <span class="heading-accent">login</span></h1>

            <form id="courier-login-form" action="#" method="post" novalidate>
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" autocomplete="username"
                           autocapitalize="none" spellcheck="false" aria-describedby="login-email-error">
                    <p id="login-email-error" class="field-error" aria-live="polite"></p>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="login-password-control">
                        <input type="password" id="login-password" name="password" autocomplete="current-password" aria-describedby="login-password-error">
                        <button type="button" id="toggle-login-password" aria-controls="login-password" aria-pressed="false" aria-label="Mostrar palavra-passe">
                            <svg class="password-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                                <path class="password-eye-slash" d="M3 3l18 18"></path>
                            </svg>
                        </button>
                    </div>
                    <p id="login-password-error" class="field-error" aria-live="polite"></p>
                </div>
                <button type="submit" class="submit-button login-submit">Log in</button>
            </form>
            <p class="login-register-prompt">Don't have an account? <a href="Registration_Courier_HTML.html">Register as Courier</a></p>
        </section>
    </main>
<footer id="about"><div class="footer-container"><div><strong>CMS</strong><p>Courier Management System</p></div><p>Keep moving. Deliver with confidence.</p><p>Enterprise Information Systems · FEUP</p></div></footer>
</body>
</html>
